name: Build Source-Only Safe Pack

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/yolov7_person_detector/**'
      - 'installer/**'
      - 'LICENSE'
      - '.github/workflows/build-safe-pack.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble safe source-only pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/The_Bastard_Source_Only/src/yolov7_person_detector
          mkdir -p dist/The_Bastard_Source_Only/installer

          cp -a src/yolov7_person_detector/. dist/The_Bastard_Source_Only/src/yolov7_person_detector/
          cp -a installer/. dist/The_Bastard_Source_Only/installer/
          cp LICENSE dist/The_Bastard_Source_Only/LICENSE
          cp INSTALL.cmd dist/The_Bastard_Source_Only/INSTALL.cmd

          cat > dist/The_Bastard_Source_Only/README-FIRST.txt <<'EOF'
THE BASTARD - SOURCE ONLY TEST PACK

This package does NOT use the SharpAI/Aegis website download.
It does NOT use the prebuilt shareai detector image.

Requirements:
- Windows 10/11
- Docker Desktop installed and running

Steps:
1. Extract this ZIP.
2. Double-click INSTALL.cmd.
3. Open The Bastard Console from the desktop.
4. Choose "Build detector locally from source".
5. Choose "Start detector".

The detector container is built from the source included in this package.
EOF

          cd dist
          zip -r -9 The_Bastard_Source_Only_Windows.zip The_Bastard_Source_Only
          sha256sum The_Bastard_Source_Only_Windows.zip > The_Bastard_Source_Only_Windows.sha256

      - name: Upload source-only safe pack
        uses: actions/upload-artifact@v4
        with:
          name: The_Bastard_Source_Only_Windows
          path: |
            dist/The_Bastard_Source_Only_Windows.zip
            dist/The_Bastard_Source_Only_Windows.sha256
          retention-days: 30
