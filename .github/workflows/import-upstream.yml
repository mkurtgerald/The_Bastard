name: Import upstream baseline

on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream codebase
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/SharpAI/DeepCamera.git /tmp/upstream
          UPSTREAM_SHA="$(git -C /tmp/upstream rev-parse HEAD)"
          rm -rf /tmp/upstream/.git

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/upstream/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import upstream donor baseline at ${UPSTREAM_SHA}"
          git push origin HEAD:main
